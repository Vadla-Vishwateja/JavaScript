<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-String</title>
</head>
<body>
    <h1>JS String Methods </h1>
    <p>it follows 0 based indexing </p>

    <script>
        let a="javascript and java"
        console.log(a);
        console.log(a.toUpperCase());
        console.log(a.lastIndexOf('a'));
        console.log(a.indexOf('a'));
        console.log(a.charAt(5));
        console.log(a.charCodeAt(5));
        console.log(a.length)
        console.log(a.slice(5))
        console.log(a.substring(7))
        console.log(a.bold())
        console.log(a)

    </script>
</body>
</html>
