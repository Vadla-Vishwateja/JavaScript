<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>
<body>
    <h1>Boolean data type</h1>
    <script>
        let a=true;
        let b=false;
        console.log(a);
        console.log(b);

        var c=20;
        var d=40;
        console.log(c>d);
        console.log(c<d);
        console.log(c==d);
        c=c+c;
        console.log(c);
        console.log(c==d);
        console.log(c==d?("Both are equal"):("both are not equal "));


        var v="20";
        var k=20;
        console.log(v==k);
        console.log(v===k);
        console.log(+v===k);
        console.log(v===k+"");

    </script>
</body>
</html>
